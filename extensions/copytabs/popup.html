<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CopyTabs</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>CopyTabs</strong>
    <nav role="tablist">
      <button role="tab" id="tab-copy" aria-selected="true" aria-controls="panel-copy">Copy</button>
      <button role="tab" id="tab-open" aria-selected="false" aria-controls="panel-open">Open</button>
    </nav>
  </header>

  <section id="panel-copy" role="tabpanel" aria-labelledby="tab-copy">
    <label class="row">Tabs
      <select id="scope">
        <option value="window">This window</option>
        <option value="all">All windows</option>
        <option value="selected">Selected tabs</option>
      </select>
    </label>
    <label class="row">Format
      <select id="format"></select>
    </label>
    <label class="check"><input type="checkbox" id="skip" checked> Skip browser pages (chrome://…)</label>
    <label class="check"><input type="checkbox" id="dedupe" checked> Remove duplicates</label>
    <button id="copy" class="primary">Copy <span id="count">0</span> tabs</button>
    <textarea id="preview" readonly aria-label="Preview" spellcheck="false"></textarea>
  </section>

  <section id="panel-open" role="tabpanel" aria-labelledby="tab-open" hidden>
    <p class="hint">Paste URLs, a Markdown list, HTML or CSV. Every link found is opened in a new tab.</p>
    <textarea id="paste" aria-label="Links to open" spellcheck="false" placeholder="https://example.com&#10;- [Docs](https://example.com/docs)"></textarea>
    <label class="check"><input type="checkbox" id="newWindow"> Open in a new window</label>
    <button id="open" class="primary" disabled>Open 0 links</button>
  </section>

  <div id="status" role="status" aria-live="polite"></div>
  <script src="lib/format.js"></script>
  <script src="popup.js"></script>
</body>
</html>
