name: Measure and judge

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST daily
  workflow_dispatch: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check kill switch
        run: |
          enabled=$(node -e "console.log(require('./loop/kill-switch.json').enabled)")
          if [ "$enabled" != "true" ]; then
            echo "Kill switch is off (loop/kill-switch.json). Stopping." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # main is protected (PRs only), so loop state lives on the unprotected
      # `loop-state` branch: main's tree plus one commit holding stats/ and
      # loop/decisions.json. Restore yesterday's stats before appending.
      - name: Restore previous loop state
        run: |
          if git fetch origin loop-state 2>/dev/null; then
            git checkout FETCH_HEAD -- stats 2>/dev/null || echo "no stats on loop-state yet"
          else
            echo "loop-state branch does not exist yet"
          fi
      - run: node scripts/fetch-public-stats.js
      - run: node scripts/judge.js
      - name: Save loop state to the loop-state branch
        run: |
          git config user.name "global-tools-loop-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B loop-state
          mkdir -p stats
          git add -A stats loop/decisions.json
          git commit --allow-empty -m "chore: loop state $(date -u +%F)"
          git push --force origin loop-state
      - name: Open an issue for any non-hold decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e '
            const fs = require("fs");
            const { decisions } = JSON.parse(fs.readFileSync("loop/decisions.json", "utf8"));
            for (const d of decisions) {
              if (d.action === "hold" || d.action === "skip") continue;
              console.log(d.name + ":" + d.action + ":" + d.reason);
            }
          ' | while IFS=: read -r name action reason; do
            [ -z "$name" ] && continue
            body=$(printf 'Reason: %s\n\nJudged at: %s\n\nThis issue was opened automatically by measure-and-judge.yml. @claude please act on the %s per closed-loop-design.md section 3-1, then close this issue in the same PR.' \
              "$reason" "$(date -u --iso-8601=seconds)" "$action")
            gh issue create \
              --title "[judge] $name -> $action" \
              --body "$body" \
              --label "loop-decision"
          done
