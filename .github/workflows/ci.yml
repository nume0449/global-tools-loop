name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: node scripts/validate-manifests.js
      - run: npm test
      - run: node scripts/package-extensions.js
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: dist/*.zip
